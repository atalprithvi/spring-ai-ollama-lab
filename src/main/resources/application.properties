spring.application.name=spring-ai-ollama-lab
server.port=8080

# Local Ollama. No API key.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:4b
# qwen3 writes a long reasoning trace unless this is turned off.
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.temperature=0.4
# Do not download models on startup. Pull them with Ollama first.
spring.ai.ollama.init.pull-model-strategy=never
